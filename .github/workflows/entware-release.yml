name: Entware Package

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  ipk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: mipsel
            toolchain: mipsel-linux-muslsf-cross
            cc_prefix: mipsel-linux-muslsf
            entware_arch: mipsel-3.4
            extra_cflags: "-march=mips32r2 -mtune=mips32r2"
          - arch: aarch64
            toolchain: aarch64-linux-musl-cross
            cc_prefix: aarch64-linux-musl
            entware_arch: aarch64-3.10
            extra_cflags: ""
          - arch: armv7
            toolchain: arm-linux-musleabi-cross
            cc_prefix: arm-linux-musleabi
            entware_arch: armv7-3.2
            extra_cflags: "-march=armv7-a -mtune=cortex-a9"
          - arch: x86_64
            toolchain: x86_64-linux-musl-cross
            cc_prefix: x86_64-linux-musl
            entware_arch: x64-3.2
            extra_cflags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install musl.cc cross-compiler
        run: |
          curl -sL "https://musl.cc/${{ matrix.toolchain }}.tgz" | tar xz -C /opt
          echo "/opt/${{ matrix.toolchain }}/bin" >> $GITHUB_PATH

      - name: Download source tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.tag || github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          gh release download "${{ inputs.tag || github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "aggregate6-${VERSION}.tar.gz"
          tar xzf "aggregate6-${VERSION}.tar.gz"

      - name: Cross-compile (static)
        run: |
          VERSION="${{ inputs.tag || github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          cd "aggregate6-${VERSION}"
          make CC="${{ matrix.cc_prefix }}-gcc" \
            CFLAGS="-Wall -Wextra -Werror -O2 -std=c99 ${{ matrix.extra_cflags }}" \
            LDFLAGS="-static" \
            LDLIBS=""
          ${{ matrix.cc_prefix }}-strip aggregate6
          file aggregate6
          readelf -A aggregate6 | grep -iE 'FP ABI|CPR1|float' || true

      - name: Create .ipk
        run: |
          VERSION="${{ inputs.tag || github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          SRCDIR="aggregate6-${VERSION}"
          WORK=$(mktemp -d)

          # data.tar.gz — binary at /opt/bin/
          mkdir -p "${WORK}/data/opt/bin"
          cp "${SRCDIR}/aggregate6" "${WORK}/data/opt/bin/"
          tar czf "${WORK}/data.tar.gz" \
            --numeric-owner --owner=0 --group=0 \
            -C "${WORK}/data" .

          # control.tar.gz — package metadata
          mkdir -p "${WORK}/control"
          printf '%s\n' \
            "Package: aggregate6" \
            "Version: ${VERSION}-1" \
            "Architecture: ${{ matrix.entware_arch }}" \
            "Maintainer: 0xkee <0xkee@users.noreply.github.com>" \
            "Section: net" \
            "Priority: optional" \
            "Description: Fast multi-threaded IPv4/IPv6 CIDR prefix aggregation tool" \
            "Source: https://github.com/0xkee/aggregate6" \
            "License: GPL-3.0-only" \
            > "${WORK}/control/control"
          tar czf "${WORK}/control.tar.gz" \
            --numeric-owner --owner=0 --group=0 \
            -C "${WORK}/control" .

          # debian-binary
          echo "2.0" > "${WORK}/debian-binary"

          # Assemble .ipk (tar.gz format for Entware/OpenWrt opkg compatibility)
          IPK="aggregate6_${VERSION}-1_${{ matrix.entware_arch }}.ipk"
          cd "${WORK}"
          tar czf "${GITHUB_WORKSPACE}/${IPK}" \
            --numeric-owner --owner=0 --group=0 \
            ./debian-binary ./control.tar.gz ./data.tar.gz

          echo "Created: ${IPK}"
          ls -lh "${GITHUB_WORKSPACE}/${IPK}"

      - name: Upload .ipk to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag || github.event.release.tag_name }}" \
            aggregate6_*.ipk \
            --clobber

  publish:
    needs: ipk
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download .ipk from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          mkdir -p ipks
          gh release download "$TAG" --pattern '*.ipk' --dir ipks/

      - name: Publish to opkg feed
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages gh-pages

          # Remove old versions
          rm -f /tmp/gh-pages/dev/aggregate6_*.ipk

          # Copy new
          mkdir -p /tmp/gh-pages/dev
          cp ipks/*.ipk /tmp/gh-pages/dev/

          # Regenerate index
          sh scripts/generate-packages-index.sh /tmp/gh-pages/dev

          # Commit
          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          VER="${TAG#v}"
          git commit -m "dev: aggregate6 v${VER}" || true
          git push origin gh-pages
