name: Promote to Stable

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    name: Promote dev → stable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Get index generator from main
        uses: actions/checkout@v4
        with:
          ref: master
          path: _main
          sparse-checkout: |
            dist/entware/scripts/generate-packages-index.sh
          sparse-checkout-cone-mode: false

      - name: Promote packages
        run: |
          # Clean stable (per-arch subdirectories and legacy flat layout)
          rm -rf stable/mipsel-3.4 stable/aarch64-3.10 stable/armv7-3.2 stable/x64-3.2
          rm -f stable/*.ipk stable/Packages stable/Packages.gz
          mkdir -p stable

          # Copy per-arch subdirectories from dev to stable
          for archdir in dev/*/; do
            [ -d "$archdir" ] || continue
            arch="$(basename "$archdir")"
            mkdir -p "stable/$arch"
            cp "$archdir"*.ipk "stable/$arch/" 2>/dev/null || true
          done
          echo "Promoted all packages from dev to stable"

      - name: Regenerate stable index
        run: sh ./_main/dist/entware/scripts/generate-packages-index.sh stable

      - name: Commit and push
        run: |
          rm -rf _main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "stable: promote aggregate6"
          git push origin gh-pages
