name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Create tarball
        run: |
          VERSION=${{ steps.version.outputs.version }}
          git archive --format=tar.gz \
            --prefix="aggregate6-${VERSION}/" \
            -o "aggregate6-${VERSION}.tar.gz" \
            "v${VERSION}"

      - name: Calculate checksums
        id: checksums
        run: |
          VERSION=${{ steps.version.outputs.version }}
          TARBALL="aggregate6-${VERSION}.tar.gz"
          SHA256=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          SHA512=$(sha512sum "$TARBALL" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$TARBALL")
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "sha512=${SHA512}" >> "$GITHUB_OUTPUT"
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"
          sha256sum "$TARBALL" > "${TARBALL}.sha256"
          sha512sum "$TARBALL" > "${TARBALL}.sha512"

      - name: Update dist/ and push to master
        run: |
          VERSION=${{ steps.version.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Switch to master — build artifacts are untracked, no conflicts
          git checkout master
          # Run update-dist.sh on master's files (not on tag's detached HEAD)
          dist/update-dist.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.checksums.outputs.sha256 }}" \
            "${{ steps.checksums.outputs.sha512 }}" \
            "${{ steps.checksums.outputs.size }}"
          git add dist/
          git diff --cached --quiet && exit 0
          git commit -m "dist: update packaging for v${VERSION}"
          git push origin master

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            aggregate6-${{ steps.version.outputs.version }}.tar.gz
            aggregate6-${{ steps.version.outputs.version }}.tar.gz.sha256
            aggregate6-${{ steps.version.outputs.version }}.tar.gz.sha512

  deb:
    needs: release
    uses: ./.github/workflows/deb-release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: write

  entware:
    needs: release
    uses: ./.github/workflows/entware-release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: write
